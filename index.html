<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Claude VTT — Battle Map</title>
<!--
  Claude VTT v4 — a dynamic battle map driven by a Claude gamemaster.

  The board renders entirely from one serializable STATE object. The Claude
  GM changes the board by emitting JSON commands (see GM_PROTOCOL.md), which
  reach the board three ways:

    1. GM console  — tap "⚙ GM" in the footer, paste the JSON Claude wrote
                     in chat, hit apply. Moves animate, damage floats,
                     announcements banner across the top.
    2. Scene links — Claude can emit a #s=<base64> link that opens a whole
                     encounter (or a command batch) directly.
    3. HTTP feed   — when served over HTTP next to a feed.json file, the
                     board polls it every 2s and applies any batch whose
                     "seq" is new. A Claude Code session editing feed.json
                     drives the board live, no pasting at all.

  The loop closes with "⧉ copy state for GM": a compact JSON summary of
  positions, HP, conditions, turn and round to paste back into chat so the
  GM always knows the real board.

  Everything else from v3 is kept: canvas terrain, pinch-zoom/pan,
  drag-to-measure tokens, initiative chips, persistence, ↺ reset.

  At the table (no GM needed):
    · tap a token to select it — the inspector edits HP, conditions, status
    · double-tap a token: fresh → wounded → down → fresh
    · tap an initiative chip to make it active; "R# ▸" advances the turn
    · pinch / wheel to zoom, drag the floor to pan, double-tap floor zooms

  Token art: game-icons.net (Lorc, Delapouite & contributors), CC BY 3.0,
  embedded as inline SVG symbols - keep this attribution comment.
-->
<style>
  :root{
    --ink:#0f1316; --panel:#171c20; --grid:#31383d;
    --lamp:#d9a35a; --bone:#cfc7b4; --hurt:#a4463c; --rope:#8a6f4b;
    --kelp:#6f9a86; --steel:#7e8c93;
    --text:#cfc7b4; --dim:#7d8489;
  }
  *{box-sizing:border-box; margin:0}
  body{background:var(--ink); color:var(--text);
    font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    display:flex; flex-direction:column; align-items:center;
    min-height:100vh; padding:16px 6px 28px; overscroll-behavior:none}
  header{text-align:center; margin-bottom:8px}
  header h1{font-size:clamp(16px,4vw,23px); font-weight:600; letter-spacing:.06em}
  header .sub{font-family:ui-monospace,Menlo,Consolas,monospace; font-size:10.5px;
    color:var(--dim); letter-spacing:.16em; text-transform:uppercase; margin-top:4px}
  .init{display:flex; flex-wrap:wrap; gap:5px; justify-content:center; margin:8px 0 12px;
    font-family:ui-monospace,monospace; font-size:11px; max-width:680px}
  .chip{background:var(--panel); border:1px solid var(--grid); border-radius:3px;
    padding:3px 8px; display:flex; gap:6px; align-items:center; cursor:pointer}
  .chip.pc b{color:var(--lamp)} .chip.foe b{color:var(--bone)}
  .chip.ally b{color:var(--kelp)} .chip.mark b{color:var(--steel)}
  .chip .d{color:var(--dim)} .chip .d.hurt{color:var(--hurt); font-style:italic}
  .chip.active{outline:1.5px solid var(--lamp)}
  .chip.gone{opacity:.4} .chip.gone b{text-decoration:line-through}
  .chip.next{border-style:dashed; color:var(--lamp)}
  .chip.next b{color:var(--lamp)}
  /* viewport clips the zoomable stage */
  #viewport{position:relative; overflow:hidden; border:1px solid var(--grid);
    border-radius:4px; background:#0b0e10; touch-action:none;
    width:min(96vw, 860px)}
  #stage{position:absolute; left:0; top:0; transform-origin:0 0}
  #scene{display:block}
  #board{position:absolute; display:grid; gap:0}
  .cell{background:transparent; position:relative}
  .prop{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    z-index:2; pointer-events:none; color:var(--bone);
    text-shadow:0 2px 3px rgba(0,0,0,.8)}
  .prop.big{color:var(--rope)}
  .token{position:absolute; z-index:5; display:flex; align-items:center; justify-content:center;
    border-radius:50%; font-family:ui-monospace,monospace; font-weight:700;
    cursor:grab; user-select:none; -webkit-user-select:none;
    box-shadow:0 3px 6px rgba(0,0,0,.55)}
  .token.pc{background:radial-gradient(circle at 35% 30%, #4a3d2c, #2e2619);
    color:var(--lamp); border:2.5px solid var(--lamp)}
  .token.foe{background:radial-gradient(circle at 35% 30%, #383a35, #23251f);
    color:var(--bone); border:2.5px solid var(--bone)}
  .token.hurt{border-color:var(--hurt); color:#d8a49b}
  .token.dragging{cursor:grabbing; z-index:9; box-shadow:0 8px 20px rgba(0,0,0,.7)}
  .token svg{width:72%; height:72%; pointer-events:none;
    filter:drop-shadow(0 1px 1px rgba(0,0,0,.6))}
  .token.pc svg{fill:var(--lamp)} .token.foe svg{fill:var(--bone)}
  .token.hurt svg{fill:#d8a49b}
  .token.ally{background:radial-gradient(circle at 35% 30%, #2c3b34, #1d2723);
    color:var(--kelp); border:2.5px solid var(--kelp)}
  .token.ally svg{fill:var(--kelp)}
  .token.mark{background:radial-gradient(circle at 35% 30%, #262c30, #191d20);
    color:var(--steel); border:2.5px dashed var(--steel)}
  .token.mark svg{fill:var(--steel)}
  .token.down{opacity:.55; border-color:#4a5054; color:#6d7478}
  .token.down svg{fill:#6d7478}
  .token.down::after{content:'✕'; position:absolute; inset:0; display:flex;
    align-items:center; justify-content:center; color:rgba(164,70,60,.9);
    font-size:85%; font-weight:400; text-shadow:0 1px 2px #000; pointer-events:none}
  .token.turn{box-shadow:0 0 0 2px #0f1316, 0 0 0 4.5px var(--lamp),
    0 4px 10px rgba(0,0,0,.6)}
  .token.anim{transition:left .5s cubic-bezier(.3,.85,.35,1), top .5s cubic-bezier(.3,.85,.35,1)}
  .token.unseen{display:none}
  .token.sel{outline:2px dashed var(--lamp); outline-offset:3px}
  .token.pulse{animation:tkpulse .9s ease-out 2}
  @keyframes tkpulse{0%{box-shadow:0 0 0 0 rgba(217,163,90,.65)}
    100%{box-shadow:0 0 0 16px rgba(217,163,90,0)}}
  .token .badge{position:absolute; right:-3px; bottom:-3px;
    background:var(--panel); border:1.5px solid currentColor; border-radius:50%;
    width:38%; height:38%; display:flex; align-items:center; justify-content:center;
    font-size:45%; line-height:1}
  .token .cond{position:absolute; top:-8%; width:34%; height:34%;
    background:var(--panel); border:1.2px solid var(--steel); border-radius:50%;
    display:flex; align-items:center; justify-content:center; pointer-events:none;
    box-shadow:0 1px 2px rgba(0,0,0,.6)}
  .token .cond svg{width:76%; height:76%; fill:var(--bone); filter:none}
  .token .hp{position:absolute; left:14%; right:14%; bottom:5%; height:3.5px;
    border-radius:2px; background:rgba(0,0,0,.6); overflow:hidden; pointer-events:none}
  .token .hp i{display:block; height:100%; background:#7fa86a}
  .token .hp.mid i{background:#c99a4b} .token .hp.low i{background:#b0503f}
  .floater{position:absolute; z-index:20; pointer-events:none;
    font:700 15px ui-monospace,monospace; text-shadow:0 1px 3px #000,0 0 6px #000;
    animation:floatup 1.5s ease-out forwards; text-align:center}
  .floater.dmg{color:#e2705a} .floater.heal{color:#93c98b} .floater.info{color:var(--lamp)}
  @keyframes floatup{0%{opacity:0; transform:translateY(6px)} 12%{opacity:1}
    100%{opacity:0; transform:translateY(-34px)}}
  .ping{position:absolute; z-index:19; width:0; height:0; pointer-events:none}
  .ping::before,.ping::after{content:''; position:absolute; left:0; top:0;
    border:2.5px solid var(--lamp); border-radius:50%; transform:translate(-50%,-50%);
    animation:pingring 1.6s ease-out forwards}
  .ping::after{animation-delay:.35s}
  @keyframes pingring{0%{width:8px; height:8px; opacity:.95}
    100%{width:130px; height:130px; opacity:0}}
  #banner{position:fixed; top:12px; left:50%; transform:translateX(-50%) translateY(-6px);
    max-width:min(92vw,620px); z-index:60; background:var(--panel);
    border:1px solid var(--lamp); border-left-width:4px; border-radius:4px;
    padding:9px 16px; font-size:14.5px; line-height:1.45; color:var(--text);
    box-shadow:0 8px 24px rgba(0,0,0,.6); opacity:0; pointer-events:none;
    transition:opacity .3s, transform .3s}
  #banner.show{opacity:1; transform:translateX(-50%) translateY(0); pointer-events:auto; cursor:pointer}
  #banner.danger{border-color:var(--hurt)} #banner.success{border-color:var(--kelp)}
  .btn{cursor:pointer; border:1px solid var(--grid); background:var(--panel);
    color:var(--text); border-radius:3px; padding:4px 10px;
    font:11px ui-monospace,Menlo,monospace; letter-spacing:.05em}
  .btn:hover{border-color:var(--lamp); color:var(--lamp)}
  .foot{margin-top:10px; display:flex; gap:10px; flex-wrap:wrap; justify-content:center;
    align-items:center; font-family:ui-monospace,monospace; font-size:11px;
    color:var(--dim); max-width:860px}
  .foot .measure{color:var(--lamp); min-width:150px; text-align:center}
  .foot .zoomhint{width:100%; text-align:center; font-size:9.5px; letter-spacing:.1em}
  .foot .shorthint{display:none; width:100%; text-align:center; font-size:9.5px;
    letter-spacing:.1em; color:var(--dim)}
  .key{width:100%; text-align:center}
  .dicerow{display:flex; gap:6px; flex-wrap:wrap; justify-content:center; width:100%}
  .exits{display:flex; gap:6px; flex-wrap:wrap; align-items:center; justify-content:center;
    width:min(96vw,860px); margin-top:8px; font-family:ui-monospace,monospace; font-size:11px}
  .exits .here{color:var(--lamp); letter-spacing:.08em; text-transform:uppercase;
    margin-right:4px; font-size:10.5px}
  .exits .exit{opacity:.45}
  .exits .exit i{color:var(--dim); font-style:normal}
  .exits .exit.ready{opacity:1; border-color:var(--lamp); color:var(--lamp)}
  .exits .exit.ready i{color:var(--lamp)}
  @media (max-width:520px){
    body{padding:10px 4px 22px}
    .init{flex-wrap:nowrap; overflow-x:auto; justify-content:flex-start;
      max-width:100vw; padding:0 6px 5px; scrollbar-width:none}
    .init::-webkit-scrollbar{display:none}
    .chip{flex:0 0 auto; padding:5px 9px}
    .btn{padding:7px 12px}
    #inspector .condbtn{width:34px; height:34px}
    #inspector .condbtn svg{width:20px; height:20px}
    .zoomhint{display:none}
    .foot .shorthint{display:block}
  }
  #inspector{display:none; width:min(96vw,860px); margin-top:8px; background:var(--panel);
    border:1px solid var(--grid); border-radius:4px; padding:8px 12px;
    font-family:ui-monospace,monospace; font-size:11.5px}
  #inspector.show{display:block}
  #inspector .row{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:4px 0}
  #inspector .nm{color:var(--lamp); font-weight:700; font-size:13px}
  #inspector .hpv{min-width:64px; text-align:center; color:var(--bone)}
  #inspector .condbtn{width:26px; height:26px; padding:2px; border-radius:50%;
    display:inline-flex; align-items:center; justify-content:center}
  #inspector .condbtn svg{width:16px; height:16px; fill:var(--dim)}
  #inspector .condbtn.on{border-color:var(--lamp)} #inspector .condbtn.on svg{fill:var(--lamp)}
  #gmconsole{display:none; width:min(96vw,860px); margin-top:8px; background:var(--panel);
    border:1px solid var(--grid); border-radius:4px; padding:10px 12px;
    font-family:ui-monospace,monospace; font-size:11.5px}
  #gmconsole.show{display:block}
  #gmin{width:100%; min-height:76px; resize:vertical; background:#0b0e10;
    color:var(--text); border:1px solid var(--grid); border-radius:3px;
    font:11.5px ui-monospace,Menlo,monospace; padding:8px; line-height:1.5}
  #gmin:focus{outline:1px solid var(--lamp)}
  .gmbtns{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:8px}
  #feedstat{color:var(--dim); margin-left:auto}
  #feedstat.live{color:var(--kelp)}
  #gmlog{list-style:none; margin-top:8px; max-height:130px; overflow-y:auto;
    border-top:1px solid var(--grid); padding-top:6px; color:var(--dim); line-height:1.65}
  #gmlog li.err{color:var(--hurt)} #gmlog li.say{color:var(--lamp)}
</style>
</head>

<script>
/* ========================= demo scene (replaced by the GM) ========================= */
const DEFAULT_SCENE = {
  header: "The North Shingle — Night",
  sub:    "fog inbound · 1 square = 5 ft",
  ground: "shingle",
  zones: [
    {from:"A1", to:"D16", type:"water"},

    {id:"B",  name:"Bren",   label:"B", at:"K7",  kind:"pc",  icon:"wizard",     hp:{cur:26,max:26}},
